<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <!-- Headset VR bergaya 3D Fluent, digambar sendiri: bodi putih bertebing, lensa biru, tali biru. -->
  <defs>
    <linearGradient id="tebing" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A9C2F0"/><stop offset="1" stop-color="#7C9DDC"/></linearGradient>
    <linearGradient id="putih" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E3EDFF"/></linearGradient>
    <linearGradient id="biru" x1="0.1" y1="0" x2="0.9" y2="1"><stop offset="0" stop-color="#58A3FF"/><stop offset="0.5" stop-color="#0A5CF0"/><stop offset="1" stop-color="#0A3FB5"/></linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0A3FB5"/><stop offset="1" stop-color="#072C86"/></linearGradient>
    <radialGradient id="lensa" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#9CCBFF"/><stop offset="0.45" stop-color="#2E7BFF"/><stop offset="1" stop-color="#0A4FD6"/></radialGradient>
    <radialGradient id="kilap" cx="0.3" cy="0.18" r="0.65"><stop offset="0" stop-color="#FFF" stop-opacity="0.9"/><stop offset="1" stop-color="#FFF" stop-opacity="0"/></radialGradient>
  </defs>
  <!-- tali samping -->
  <rect x="8" y="86" width="40" height="70" rx="18" fill="url(#biru)"/>
  <rect x="208" y="86" width="40" height="70" rx="18" fill="url(#biru)"/>
  <!-- bodi -->
  <rect x="22" y="76" width="212" height="132" rx="56" fill="url(#tebing)"/>
  <rect x="22" y="56" width="212" height="132" rx="56" fill="url(#putih)" stroke="#C5D6F4" stroke-width="3"/>
  <!-- layar visor -->
  <rect x="38" y="72" width="180" height="100" rx="44" fill="url(#visor)"/>
  <!-- lensa -->
  <circle cx="90" cy="122" r="34" fill="#FFFFFF" opacity="0.95"/>
  <circle cx="90" cy="122" r="28" fill="url(#lensa)"/>
  <circle cx="166" cy="122" r="34" fill="#FFFFFF" opacity="0.95"/>
  <circle cx="166" cy="122" r="28" fill="url(#lensa)"/>
  <ellipse cx="79" cy="110" rx="11" ry="7" fill="#FFFFFF" opacity="0.85"/>
  <ellipse cx="155" cy="110" rx="11" ry="7" fill="#FFFFFF" opacity="0.85"/>
  <ellipse cx="100" cy="66" rx="64" ry="12" fill="url(#kilap)" opacity="0.7"/>
  <!-- kilau kuning -->
  <path d="M216 24 l5 11 11 5 -11 5 -5 11 -5 -11 -11 -5 11 -5z" fill="#FFC926"/>
  <path d="M36 214 l3.5 8 8 3.5 -8 3.5 -3.5 8 -3.5 -8 -8 -3.5 8 -3.5z" fill="#FFC926"/>
</svg>
