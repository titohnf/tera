<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <!-- Layar bioskop melengkung bergaya 3D Fluent, digambar sendiri: ujung kiri-kanan lebih tinggi (cekung ke penonton), play putih, kursi di depan. -->
  <defs>
    <linearGradient id="tebing" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A9C2F0"/><stop offset="1" stop-color="#7C9DDC"/></linearGradient>
    <linearGradient id="putih" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E3EDFF"/></linearGradient>
    <linearGradient id="biru" x1="0.1" y1="0" x2="0.9" y2="1"><stop offset="0" stop-color="#58A3FF"/><stop offset="0.5" stop-color="#0A5CF0"/><stop offset="1" stop-color="#0A3FB5"/></linearGradient>
    <linearGradient id="kursi" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1F6BFF"/><stop offset="1" stop-color="#0A3FB5"/></linearGradient>
    <linearGradient id="tepi" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="0.2" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.8" stop-color="#061A5C" stop-opacity="0"/>
      <stop offset="1" stop-color="#061A5C" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="kilap" cx="0.3" cy="0.18" r="0.65"><stop offset="0" stop-color="#FFF" stop-opacity="0.9"/><stop offset="1" stop-color="#FFF" stop-opacity="0"/></radialGradient>
    <filter id="bayang" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="3.5" flood-color="#0A2A8C" flood-opacity="0.3"/></filter>
  </defs>
  <!-- tebing bingkai -->
  <path d="M26 46 Q128 94 230 46 L230 162 Q128 118 26 162 Z" fill="url(#tebing)" stroke="url(#tebing)" stroke-width="18" stroke-linejoin="round" transform="translate(0 14)"/>
  <!-- bingkai putih -->
  <path d="M26 46 Q128 94 230 46 L230 162 Q128 118 26 162 Z" fill="url(#putih)" stroke="url(#putih)" stroke-width="18" stroke-linejoin="round"/>
  <!-- layar biru (cekung) -->
  <path d="M38 58 Q128 100 218 58 L218 150 Q128 112 38 150 Z" fill="url(#biru)" stroke="url(#biru)" stroke-width="10" stroke-linejoin="round"/>
  <path d="M38 58 Q128 100 218 58 L218 150 Q128 112 38 150 Z" fill="url(#tepi)" stroke="url(#tepi)" stroke-width="10" stroke-linejoin="round"/>
  <ellipse cx="86" cy="74" rx="40" ry="8" fill="url(#kilap)" opacity="0.5"/>
  <!-- play -->
  <g filter="url(#bayang)"><path d="M114 88 L148 106 L114 124 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="11" stroke-linejoin="round"/></g>
  <!-- kursi bioskop -->
  <rect x="34" y="204" width="52" height="38" rx="16" fill="#0A3FB5"/>
  <rect x="34" y="196" width="52" height="38" rx="16" fill="url(#kursi)"/>
  <rect x="102" y="204" width="52" height="38" rx="16" fill="#0A3FB5"/>
  <rect x="102" y="196" width="52" height="38" rx="16" fill="url(#kursi)"/>
  <rect x="170" y="204" width="52" height="38" rx="16" fill="#0A3FB5"/>
  <rect x="170" y="196" width="52" height="38" rx="16" fill="url(#kursi)"/>
  <!-- kilau kuning -->
  <path d="M232 16 l5 11 11 5 -11 5 -5 11 -5 -11 -11 -5 11 -5z" fill="#FFC926"/>
  <path d="M22 14 l3.5 8 8 3.5 -8 3.5 -3.5 8 -3.5 -8 -8 -3.5 8 -3.5z" fill="#FFC926"/>
</svg>
