<svg xmlns="http://www.w3.org/2000/svg" viewBox="27 22 232 232" fill="none">
  <!-- Tangan menekan (tap) bergaya 3D Fluent, digambar sendiri: tangan kuning bergradasi, dua lingkaran gelombang biru. -->
  <defs>
    <linearGradient id="tangan" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FFE98A"/><stop offset="0.45" stop-color="#FFC926"/><stop offset="1" stop-color="#F59A00"/>
    </linearGradient>
    <linearGradient id="tebing" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E58A00"/><stop offset="1" stop-color="#C46F00"/></linearGradient>
    <linearGradient id="gelombang" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4C97FF"/><stop offset="1" stop-color="#0A4FD6"/></linearGradient>
    <radialGradient id="kilap" cx="0.3" cy="0.15" r="0.7"><stop offset="0" stop-color="#FFF" stop-opacity="0.75"/><stop offset="1" stop-color="#FFF" stop-opacity="0"/></radialGradient>
    <filter id="bayang" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="3.5" flood-color="#A85A00" flood-opacity="0.3"/></filter>
  </defs>

  <!-- lingkaran gelombang -->
  <path d="M65 107.6 A62 62 0 1 1 183 107.6" stroke="url(#gelombang)" stroke-width="11" stroke-linecap="round"/>
  <path d="M91 101.3 A36 36 0 1 1 157 101.3" stroke="url(#gelombang)" stroke-width="11" stroke-linecap="round"/>

  <!-- tangan: tebing (sisi bawah) -->
  <g fill="url(#tebing)" transform="translate(0 6)">
    <rect x="108" y="84" width="34" height="140" rx="17"/>
    <rect x="108" y="128" width="116" height="104" rx="28"/>
    <path d="M114 176 Q90 152 74 158 Q64 164 70 178 L104 238 L134 238 Z" stroke="url(#tebing)" stroke-width="12" stroke-linejoin="round"/>
  </g>
  <!-- tangan: badan -->
  <g filter="url(#bayang)" fill="url(#tangan)">
    <rect x="108" y="84" width="34" height="140" rx="17"/>
    <rect x="108" y="128" width="116" height="104" rx="28"/>
    <path d="M114 176 Q90 152 74 158 Q64 164 70 178 L104 238 L134 238 Z" stroke="url(#tangan)" stroke-width="12" stroke-linejoin="round"/>
  </g>
  <!-- tiga jari tertekuk -->
  <g fill="url(#tangan)">
    <rect x="146" y="120" width="30" height="46" rx="15"/>
    <rect x="176" y="126" width="30" height="46" rx="15"/>
    <rect x="200" y="136" width="28" height="44" rx="14"/>
  </g>
  <!-- garis antar jari -->
  <g stroke="#E58A00" stroke-width="3.5" stroke-linecap="round" opacity="0.55">
    <path d="M144 160 V132"/><path d="M175 168 V138"/><path d="M200 176 V146"/>
  </g>
  <!-- kilap -->
  <ellipse cx="122" cy="108" rx="14" ry="26" fill="url(#kilap)"/>
</svg>
