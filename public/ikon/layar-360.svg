<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <!-- Layar 360° (silinder) bergaya 3D Fluent, digambar sendiri. Langit di bibir atas dan di dinding belakang SATU bidang
       (tanpa tepi terpisah); gunung satu nada dengan langit; dinding depan terbuka di tengah. Tanpa awan dan kilau. -->
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A4FD6"/><stop offset="0.5" stop-color="#2E7BFF"/><stop offset="1" stop-color="#0A5CF0"/>
    </linearGradient>
    <linearGradient id="panelTebing" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0A4FD6"/><stop offset="1" stop-color="#0A3FB5"/></linearGradient>
    <linearGradient id="langit" gradientUnits="userSpaceOnUse" x1="0" y1="44" x2="0" y2="190">
      <stop offset="0" stop-color="#EAF4FF"/><stop offset="0.5" stop-color="#BFDDFF"/><stop offset="1" stop-color="#8CC0FF"/>
    </linearGradient>
    <linearGradient id="gunungBelakang" gradientUnits="userSpaceOnUse" x1="0" y1="100" x2="0" y2="190">
      <stop offset="0" stop-color="#9CC9FF"/><stop offset="1" stop-color="#78B0FF"/>
    </linearGradient>
    <linearGradient id="gunungDepan" gradientUnits="userSpaceOnUse" x1="0" y1="120" x2="0" y2="190">
      <stop offset="0" stop-color="#78B0FF"/><stop offset="1" stop-color="#5A9CFF"/>
    </linearGradient>
    <radialGradient id="matahari" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#FFF3A6"/><stop offset="0.6" stop-color="#FFC926"/><stop offset="1" stop-color="#F59A00"/></radialGradient>
    <clipPath id="dinding"><path d="M10 66 A118 22 0 0 0 246 66 L246 190 A118 22 0 0 0 10 190 Z"/></clipPath>
  </defs>

  <!-- tebing panel depan (sisi bawah) -->
  <path d="M10 66 A118 22 0 0 0 67 84.8 L67 208.8 A118 22 0 0 1 10 190 Z" fill="url(#panelTebing)" transform="translate(0 5)"/>
  <path d="M246 66 A118 22 0 0 1 189 84.8 L189 208.8 A118 22 0 0 0 246 190 Z" fill="url(#panelTebing)" transform="translate(0 5)"/>

  <!-- langit: bibir atas + dinding belakang, satu bidang -->
  <path d="M10 66 A118 22 0 0 1 246 66 L246 190 A118 22 0 0 0 10 190 Z" fill="url(#langit)"/>

  <g clip-path="url(#dinding)">
    <circle cx="106" cy="116" r="19" fill="url(#matahari)"/>
    <path d="M18 184 L84 128 L114 156 L150 106 L238 184 Z" fill="url(#gunungBelakang)"/>
    <path d="M50 190 L110 146 L146 172 L190 138 L242 190 Z" fill="url(#gunungDepan)"/>
  </g>

  <!-- panel depan -->
  <path d="M10 66 A118 22 0 0 0 67 84.8 L67 208.8 A118 22 0 0 1 10 190 Z" fill="url(#panel)"/>
  <path d="M246 66 A118 22 0 0 1 189 84.8 L189 208.8 A118 22 0 0 0 246 190 Z" fill="url(#panel)"/>
</svg>
