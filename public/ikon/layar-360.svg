<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <!-- Layar 360° (silinder) bergaya 3D Fluent, digambar sendiri. Langit di bibir atas dan di dinding belakang SATU bidang
       (tanpa tepi terpisah, supaya tidak seperti topi); gunung satu nada dengan langit; dinding depan terbuka di tengah. -->
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A4FD6"/><stop offset="0.5" stop-color="#2E7BFF"/><stop offset="1" stop-color="#0A5CF0"/>
    </linearGradient>
    <linearGradient id="panelTebing" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0A3FB5"/><stop offset="1" stop-color="#082B8C"/></linearGradient>
    <linearGradient id="langit" gradientUnits="userSpaceOnUse" x1="0" y1="44" x2="0" y2="190">
      <stop offset="0" stop-color="#EAF4FF"/><stop offset="0.5" stop-color="#BFDDFF"/><stop offset="1" stop-color="#8CC0FF"/>
    </linearGradient>
    <linearGradient id="gunungBelakang" gradientUnits="userSpaceOnUse" x1="0" y1="100" x2="0" y2="190">
      <stop offset="0" stop-color="#9CC9FF"/><stop offset="1" stop-color="#78B0FF"/>
    </linearGradient>
    <linearGradient id="gunungDepan" gradientUnits="userSpaceOnUse" x1="0" y1="120" x2="0" y2="190">
      <stop offset="0" stop-color="#78B0FF"/><stop offset="1" stop-color="#5A9CFF"/>
    </linearGradient>
    <radialGradient id="matahari" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#FFF3A6"/><stop offset="0.6" stop-color="#FFC926"/><stop offset="1" stop-color="#F59A00"/></radialGradient>
    <clipPath id="dinding"><path d="M20 66 A108 22 0 0 0 236 66 L236 190 A108 22 0 0 0 20 190 Z"/></clipPath>
  </defs>

  <!-- tebing panel depan (sisi bawah) -->
  <path d="M20 66 A108 22 0 0 0 72 88.8 L72 204.8 A108 22 0 0 1 20 190 Z" fill="url(#panelTebing)" transform="translate(0 10)"/>
  <path d="M236 66 A108 22 0 0 1 184 88.8 L184 204.8 A108 22 0 0 0 236 190 Z" fill="url(#panelTebing)" transform="translate(0 10)"/>

  <!-- langit: bibir atas + dinding belakang, satu bidang -->
  <path d="M20 66 A108 22 0 0 1 236 66 L236 190 A108 22 0 0 0 20 190 Z" fill="url(#langit)"/>
  <!-- awan di bibir atas: nada yang sama, sedikit lebih dalam -->
  <ellipse cx="84" cy="58" rx="30" ry="7" fill="#C9E2FF" opacity="0.9"/>
  <ellipse cx="170" cy="54" rx="24" ry="6" fill="#C9E2FF" opacity="0.8"/>

  <g clip-path="url(#dinding)">
    <circle cx="104" cy="112" r="12" fill="url(#matahari)"/>
    <path d="M30 184 L88 128 L116 156 L150 106 L226 184 Z" fill="url(#gunungBelakang)"/>
    <path d="M60 190 L112 146 L146 172 L184 138 L232 190 Z" fill="url(#gunungDepan)"/>
  </g>

  <!-- panel depan -->
  <path d="M20 66 A108 22 0 0 0 72 88.8 L72 204.8 A108 22 0 0 1 20 190 Z" fill="url(#panel)"/>
  <path d="M236 66 A108 22 0 0 1 184 88.8 L184 204.8 A108 22 0 0 0 236 190 Z" fill="url(#panel)"/>

  <!-- kilau kuning -->
  <path d="M232 22 l5 11 11 5 -11 5 -5 11 -5 -11 -11 -5 11 -5z" fill="#FFC926"/>
  <path d="M24 24 l3.5 8 8 3.5 -8 3.5 -3.5 8 -3.5 -8 -8 -3.5 8 -3.5z" fill="#FFC926"/>
</svg>
