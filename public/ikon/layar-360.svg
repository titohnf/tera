<svg xmlns="http://www.w3.org/2000/svg" viewBox="24 23 208 208" fill="none">
  <!-- Layar 360° melengkung bergaya 3D Fluent, digambar sendiri. Tanpa panel samping: layar tetap terlihat melengkung lewat tepi
       atas dan bawah yang melengkung serta sisi kiri-kanan yang digelapkan halus (seperti dinding silinder yang menekuk).
       Langit satu bidang, gunung satu nada dengan langit. -->
  <defs>
    <linearGradient id="langit" gradientUnits="userSpaceOnUse" x1="0" y1="42" x2="0" y2="212">
      <stop offset="0" stop-color="#EAF4FF"/><stop offset="0.5" stop-color="#BFDDFF"/><stop offset="1" stop-color="#8CC0FF"/>
    </linearGradient>
    <linearGradient id="gunungBelakang" gradientUnits="userSpaceOnUse" x1="0" y1="110" x2="0" y2="212">
      <stop offset="0" stop-color="#9CC9FF"/><stop offset="1" stop-color="#78B0FF"/>
    </linearGradient>
    <linearGradient id="gunungDepan" gradientUnits="userSpaceOnUse" x1="0" y1="150" x2="0" y2="212">
      <stop offset="0" stop-color="#78B0FF"/><stop offset="1" stop-color="#5A9CFF"/>
    </linearGradient>
    <linearGradient id="tekuk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A3FB5" stop-opacity="0.45"/>
      <stop offset="0.16" stop-color="#0A3FB5" stop-opacity="0.12"/>
      <stop offset="0.3" stop-color="#0A3FB5" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#0A3FB5" stop-opacity="0"/>
      <stop offset="0.84" stop-color="#0A3FB5" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#0A3FB5" stop-opacity="0.45"/>
    </linearGradient>
    <radialGradient id="matahari" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#FFF3A6"/><stop offset="0.6" stop-color="#FFC926"/><stop offset="1" stop-color="#F59A00"/></radialGradient>
    <clipPath id="layar"><path d="M32 60 A96 18 0 0 1 224 60 L224 212 A96 18 0 0 0 32 212 Z"/></clipPath>
  </defs>

  <!-- layar: bibir atas + dinding belakang, satu bidang -->
  <path d="M32 60 A96 18 0 0 1 224 60 L224 212 A96 18 0 0 0 32 212 Z" fill="url(#langit)"/>
  <g clip-path="url(#layar)">
    <circle cx="116" cy="102" r="19" fill="url(#matahari)"/>
    <path d="M32 208 L88 140 L114 168 L148 112 L224 208 Z" fill="url(#gunungBelakang)"/>
    <path d="M32 212 L108 160 L142 186 L182 152 L224 212 Z" fill="url(#gunungDepan)"/>
    <!-- sisi kiri-kanan menekuk menjauh: kesan lengkung -->
    <rect x="32" y="30" width="192" height="190" fill="url(#tekuk)"/>
  </g>
</svg>
