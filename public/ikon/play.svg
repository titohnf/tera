<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <!-- Ikon play bergaya 3D Fluent, digambar sendiri: piringan putih bertebing + segitiga biru. -->
  <defs>
    <linearGradient id="tebing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A9C2F0"/>
      <stop offset="1" stop-color="#7C9DDC"/>
    </linearGradient>
    <linearGradient id="dasar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E3EDFF"/>
    </linearGradient>
    <linearGradient id="segitiga" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#58A3FF"/>
      <stop offset="0.5" stop-color="#0A5CF0"/>
      <stop offset="1" stop-color="#0A3FB5"/>
    </linearGradient>
    <radialGradient id="kilap" cx="0.3" cy="0.18" r="0.65">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="bayang" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#0A2A8C" flood-opacity="0.28"/>
    </filter>
  </defs>
  <circle cx="128" cy="144" r="108" fill="url(#tebing)"/>
  <circle cx="128" cy="126" r="107" fill="url(#dasar)" stroke="#C5D6F4" stroke-width="3"/>
  <ellipse cx="98" cy="70" rx="68" ry="40" fill="url(#kilap)"/>
  <g filter="url(#bayang)">
    <path d="M110 84 L178 126 L110 168 Z" fill="url(#segitiga)" stroke="url(#segitiga)" stroke-width="20" stroke-linejoin="round"/>
  </g>
  <path d="M60 52 l5 11 11 5 -11 5 -5 11 -5 -11 -11 -5 11 -5z" fill="#FFC926"/>
  <path d="M202 196 l3.5 8 8 3.5 -8 3.5 -3.5 8 -3.5 -8 -8 -3.5 8 -3.5z" fill="#FFC926"/>
</svg>
