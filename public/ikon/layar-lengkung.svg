<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <!-- Layar melengkung bergaya 3D Fluent, digambar sendiri: bodi putih bertebing, layar biru yang melengkung, play putih. -->
  <defs>
    <linearGradient id="tebing" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A9C2F0"/><stop offset="1" stop-color="#7C9DDC"/></linearGradient>
    <linearGradient id="putih" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E3EDFF"/></linearGradient>
    <linearGradient id="biru" x1="0.1" y1="0" x2="0.9" y2="1"><stop offset="0" stop-color="#58A3FF"/><stop offset="0.5" stop-color="#0A5CF0"/><stop offset="1" stop-color="#0A3FB5"/></linearGradient>
    <linearGradient id="lengkung" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#061A5C" stop-opacity="0.55"/>
      <stop offset="0.28" stop-color="#061A5C" stop-opacity="0"/>
      <stop offset="0.72" stop-color="#061A5C" stop-opacity="0"/>
      <stop offset="1" stop-color="#061A5C" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="kilap" cx="0.3" cy="0.18" r="0.65"><stop offset="0" stop-color="#FFF" stop-opacity="0.9"/><stop offset="1" stop-color="#FFF" stop-opacity="0"/></radialGradient>
    <filter id="bayang" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="3.5" flood-color="#0A2A8C" flood-opacity="0.3"/></filter>
  </defs>
  <!-- penyangga -->
  <path d="M116 196 h24 v22 h-24z" fill="url(#tebing)"/>
  <rect x="84" y="214" width="88" height="16" rx="8" fill="url(#tebing)"/>
  <!-- tebing bodi -->
  <path d="M24 92 Q128 130 232 92 L232 168 Q128 206 24 168 Z" fill="url(#tebing)" stroke="url(#tebing)" stroke-width="22" stroke-linejoin="round" transform="translate(0 16)"/>
  <!-- bodi putih -->
  <path d="M24 92 Q128 130 232 92 L232 168 Q128 206 24 168 Z" fill="url(#putih)" stroke="url(#putih)" stroke-width="22" stroke-linejoin="round"/>
  <path d="M24 92 Q128 130 232 92 L232 168 Q128 206 24 168 Z" fill="none" stroke="#C5D6F4" stroke-width="2" stroke-linejoin="round" transform="translate(0 -0.5)" opacity="0"/>
  <!-- layar -->
  <path d="M38 98 Q128 134 218 98 L218 162 Q128 198 38 162 Z" fill="url(#biru)" stroke="url(#biru)" stroke-width="14" stroke-linejoin="round"/>
  <path d="M38 98 Q128 134 218 98 L218 162 Q128 198 38 162 Z" fill="url(#lengkung)" stroke="url(#lengkung)" stroke-width="14" stroke-linejoin="round"/>
  <ellipse cx="100" cy="104" rx="56" ry="10" fill="url(#kilap)" opacity="0.55"/>
  <!-- play -->
  <g filter="url(#bayang)"><path d="M114 128 L148 148 L114 168 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="12" stroke-linejoin="round"/></g>
  <!-- kilau kuning -->
  <path d="M226 40 l5 11 11 5 -11 5 -5 11 -5 -11 -11 -5 11 -5z" fill="#FFC926"/>
  <path d="M26 206 l3.5 8 8 3.5 -8 3.5 -3.5 8 -3.5 -8 -8 -3.5 8 -3.5z" fill="#FFC926"/>
</svg>
